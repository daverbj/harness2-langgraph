name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[coding,render]'
      - name: Check CLI
        run: h2-code chat --help
      - name: Test coding agent (no API key required)
        run: python -m unittest discover -s tests/coding -v
      - name: Test upstream workflow
        run: python -m unittest discover -s tests -v
